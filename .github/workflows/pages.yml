name: Publicar en GitHub Pages

# No hay paso de compilación: los informes ya son HTML autocontenido y la
# portada la genera `tools/cti_build.py` antes del commit. Este flujo sólo
# empaqueta la raíz del repositorio y la despliega.
#
# `enablement: true` en configure-pages crea el sitio la primera vez usando el
# token del propio flujo, de modo que no hace falta activarlo a mano en los
# ajustes del repositorio.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan dos pushes seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Red de seguridad: si lo publicado no coincide con lo que producen los
      # `.md`, es mejor no desplegar que servir un índice que miente.
      - name: Comprobar que los artefactos derivados están al día
        run: python3 tools/cti_build.py --check

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
